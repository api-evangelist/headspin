aid: headspin
name: HeadSpin
description: >-
  HeadSpin is a real-device digital-experience, functional, and performance testing platform for
  mobile, web, and OTT applications. Teams test, monitor, and optimize app behavior on real devices
  and real SIMs across 60+ locations in 50+ countries, running manual and automated tests through
  frameworks such as Appium and Selenium while capturing 130+ performance KPIs across app, device,
  browser, audio-video, and network layers. HeadSpin exposes a v0 REST API (Bearer API-token auth)
  for authentication, device management, capture sessions, app instrumentation, biometrics, and
  audio/video capture, plus an official `hs` command-line interface and a family of open-source
  Appium drivers for Roku, LG WebOS, and Samsung Tizen TV.
